name: Build UDPFS Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Cache Dependencies
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper files..."
            # Generate in an isolated empty dir so it doesn't try to
            # evaluate this project's build.gradle.kts (which fails
            # trying to resolve the AGP plugin outside a real build).
            mkdir -p /tmp/gradle-wrapper-gen
            wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle-8.2-bin.zip
            unzip -q /tmp/gradle-8.2-bin.zip -d /tmp
            (cd /tmp/gradle-wrapper-gen && /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2)
            cp -r /tmp/gradle-wrapper-gen/gradlew .
            cp -r /tmp/gradle-wrapper-gen/gradlew.bat .
            cp -r /tmp/gradle-wrapper-gen/gradle .
            rm -rf /tmp/gradle-8.2-bin.zip /tmp/gradle-8.2 /tmp/gradle-wrapper-gen
          else
            echo "gradlew already present, skipping generation."
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDPFS-Server-APK
          path: app/build/outputs/apk/debug/app-debug.apk
